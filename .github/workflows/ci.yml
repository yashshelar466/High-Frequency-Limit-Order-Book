name: CI

# Run on every branch push and every pull request, so feature branches are
# validated before they reach main (not only pushes to main itself).
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build unit tests
        run: g++ -std=c++17 -Iinclude src/OrderBook.cpp tests/test_matching.cpp -o run_tests

      - name: Run unit tests
        run: ./run_tests

      - name: Build differential test
        run: g++ -O2 -std=c++17 -Iinclude src/OrderBook.cpp tests/test_differential.cpp -o run_diff

      - name: Run differential test
        run: ./run_diff

      - name: Build & run test suites under ASan/UBSan
        run: |
          g++ -std=c++17 -fsanitize=address,undefined -fno-sanitize-recover=all -g \
            -Iinclude src/OrderBook.cpp tests/test_matching.cpp -o run_tests_san
          ./run_tests_san
          g++ -std=c++17 -fsanitize=address,undefined -fno-sanitize-recover=all -g \
            -Iinclude src/OrderBook.cpp tests/test_differential.cpp -o run_diff_san
          ./run_diff_san

      - name: Build benchmark
        run: g++ -O3 -std=c++17 -Iinclude src/OrderBook.cpp benchmarks/benchmark_latency.cpp -o run_benchmark

      - name: Build replayer
        run: g++ -std=c++17 -Iinclude src/OrderBook.cpp src/replay_main.cpp -o run_feed
