name: CI

# Run on every branch push and every pull request, so feature branches are
# validated before they reach main (not only pushes to main itself).
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Configure & build with ASan/UBSan
        run: cmake -S . -B build-san -DENABLE_SANITIZERS=ON && cmake --build build-san -j

      - name: Test under ASan/UBSan
        run: ctest --test-dir build-san --output-on-failure
